<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- onlyLeveling mark: a dumbbell under two rising chevrons ("level up"). Drawn for this project. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171c33"/>
      <stop offset="1" stop-color="#04050b"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="230" r="210" fill="url(#glow)"/>
  <path d="M146 232 L256 132 L366 232" fill="none" stroke="url(#up)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <path d="M146 312 L256 212 L366 312" fill="none" stroke="url(#up)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="186" y="362" width="140" height="18" rx="9" fill="#e5e7eb"/>
  <rect x="150" y="338" width="36" height="66" rx="12" fill="#f8fafc"/>
  <rect x="326" y="338" width="36" height="66" rx="12" fill="#f8fafc"/>
  <rect x="124" y="350" width="26" height="42" rx="9" fill="#cbd5e1"/>
  <rect x="362" y="350" width="26" height="42" rx="9" fill="#cbd5e1"/>
</svg>
